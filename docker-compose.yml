services:

  db:
    image: postgres:latest
    container_name: tdbo-db
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
    ports:
      - ${DB_PORT}:5432
    restart: unless-stopped
    networks:
      - tdbo-nw
    volumes:
      - ./backend/db/data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    container_name: ${APP_HOST}
    build: ./backend
    restart: unless-stopped
    ports:
      - ${APP_PORT}:3000
    volumes:
      - ./backend:/app
      - node_modules:/app/node_modules
    networks:
      - tdbo-nw
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: tdbo-front
    build: ./frontend
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - tdbo-nw
    depends_on:
      - app

networks:
  tdbo-nw:
    driver: bridge

volumes:
  node_modules:
  frontend_node_modules:
